<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok FBT → Amazon 4×6 Label Converter</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Convert TikTok FBT duplicate-label PDFs into Amazon-compatible 4×6 shipping labels" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.dark, html.dark body {
        background-color: #000000 !important;
        color: #ffffff;
      }
      html.light, html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
    </style>
    <script>
      (function () {
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        // Default to dark mode (TikTok style)
        const saved = localStorage.getItem("tt-label-theme");
        applyThemeToDOM(saved || "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
